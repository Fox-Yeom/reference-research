<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조사 흐름</title>
<!-- Source of assets/readme-flow.png (README "흐름"). diagram-design flowchart grammar, board G palette, system Korean fonts.
     PNG: a 2x screenshot of the #flow svg in headless Chrome (README uses the PNG so Korean labels render with the same fonts everywhere). -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0e0e11; color: #f2f2f4; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; display: flex; justify-content: center; padding: 24px; }
  svg { width: 100%; max-width: 1000px; min-width: 760px; display: block; }
</style>
</head>
<body>
<svg id="flow" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">조사 흐름</title>
  <desc id="flow-desc">조사 흐름: 요청에서 개요 확인(사람 확인), 최신순 탐색 바퀴(첫 바퀴 뒤 사람 확인)를 거쳐 새 패턴이 나오지 않거나 3바퀴가 되면 캡처, 발견 기록, 판단 자료 보드로 이어지고, 사람이 판단한 뒤 다음 조사로 돌아간다.</desc>
  <defs>
    <pattern id="flow-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(242,242,244,0.07)"/></pattern>
    <marker id="flow-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6af"/></marker>
    <marker id="flow-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4fe3a5"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0e0e11"/>
  <rect width="100%" height="100%" fill="url(#flow-dots)"/>

  <!-- arrows first, behind the nodes -->
  <g fill="none" stroke="#a6a6af" stroke-width="1.3">
    <line x1="190" y1="122" x2="248" y2="122" marker-end="url(#flow-a)"/>
    <line x1="400" y1="122" x2="458" y2="122" marker-end="url(#flow-a)"/>
    <line x1="610" y1="122" x2="708" y2="122" marker-end="url(#flow-a)"/>
    <!-- 새 패턴 있음, 3바퀴 전: 다음 바퀴 -->
    <path d="M790 78 V56 A8 8 0 0 0 782 48 H543 A8 8 0 0 0 535 56 V94" marker-end="url(#flow-a)"/>
    <!-- 새 패턴 없음 또는 3바퀴: 캡처로 -->
    <line x1="790" y1="166" x2="790" y2="274" marker-end="url(#flow-a)"/>
    <line x1="715" y1="302" x2="612" y2="302" marker-end="url(#flow-a)"/>
    <line x1="460" y1="302" x2="402" y2="302" marker-end="url(#flow-a)"/>
  </g>
  <line x1="250" y1="302" x2="192" y2="302" stroke="#4fe3a5" stroke-width="1.5" marker-end="url(#flow-g)"/>
  <!-- 다음 조사: 사람이 고른 결정과 질문이 다음 요청이 된다 -->
  <line x1="115" y1="274" x2="115" y2="152" stroke="#a6a6af" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#flow-a)"/>

  <!-- arrow labels on masks -->
  <rect x="600" y="40" width="126" height="16" rx="2" fill="#0e0e11"/>
  <text x="663" y="52" fill="#a6a6af" font-size="10.5" text-anchor="middle">새 패턴 · 다음 바퀴(최대 3)</text>
  <rect x="802" y="212" width="112" height="16" rx="2" fill="#0e0e11"/>
  <text x="858" y="224" fill="#a6a6af" font-size="10.5" text-anchor="middle">새 패턴 없음 · 3바퀴</text>
  <rect x="127" y="205" width="62" height="16" rx="2" fill="#0e0e11"/>
  <text x="158" y="217" fill="#a6a6af" font-size="10.5" text-anchor="middle">다음 조사</text>

  <g font-size="13.5" font-weight="600" text-anchor="middle" fill="#f2f2f4">
    <!-- 1 요청 (start) -->
    <rect x="40" y="94" width="150" height="56" rx="22" fill="rgba(242,242,244,0.03)" stroke="rgba(242,242,244,0.35)"/>
    <text x="115" y="119">요청</text>
    <text x="115" y="137" font-size="10.5" font-weight="400" fill="#a6a6af">조사 맡기기</text>
    <!-- 2 개요 확인 -->
    <rect x="250" y="94" width="150" height="56" rx="6" fill="#17171b" stroke="rgba(242,242,244,0.6)"/>
    <text x="325" y="119">개요 확인</text>
    <text x="325" y="137" font-size="10.5" font-weight="400" fill="#a6a6af">질문 → 개요표 확인</text>
    <!-- 3 탐색 바퀴 -->
    <rect x="460" y="94" width="150" height="56" rx="6" fill="#17171b" stroke="rgba(242,242,244,0.6)"/>
    <text x="535" y="119">탐색 바퀴</text>
    <text x="535" y="137" font-size="10.5" font-weight="400" fill="#a6a6af">최신순 질의 · 후보</text>
    <!-- decision -->
    <polygon points="790,78 870,122 790,166 710,122" fill="#17171b" stroke="rgba(242,242,244,0.6)"/>
    <text x="790" y="119">새 패턴</text>
    <text x="790" y="136" font-size="10.5" font-weight="400" fill="#a6a6af">판단 분기</text>
    <!-- 4 캡처 -->
    <rect x="715" y="274" width="150" height="56" rx="6" fill="#17171b" stroke="rgba(242,242,244,0.6)"/>
    <text x="790" y="299">캡처 · 노트</text>
    <text x="790" y="317" font-size="10.5" font-weight="400" fill="#a6a6af">화면 단위 · 의도 역추적</text>
    <!-- 5 발견 기록 -->
    <rect x="460" y="274" width="150" height="56" rx="6" fill="#17171b" stroke="rgba(242,242,244,0.6)"/>
    <text x="535" y="299">발견 기록</text>
    <text x="535" y="317" font-size="10.5" font-weight="400" fill="#a6a6af">출처 S# · 근거 세기</text>
    <!-- 6 판단 자료 보드 -->
    <rect x="250" y="274" width="150" height="56" rx="6" fill="#17171b" stroke="rgba(242,242,244,0.6)"/>
    <text x="325" y="299">판단 자료 보드</text>
    <text x="325" y="317" font-size="10.5" font-weight="400" fill="#a6a6af">관찰 · 반대 관찰 · 선택지</text>
    <!-- 7 사람의 판단 (end, focal) -->
    <rect x="40" y="274" width="150" height="56" rx="22" fill="rgba(79,227,165,0.10)" stroke="#4fe3a5"/>
    <text x="115" y="299">사람의 판단</text>
    <text x="115" y="317" font-size="10.5" font-weight="400" fill="#a6a6af">결정 복사</text>
  </g>

  <!-- the person confirms here: the outline table, then the direction after the first round -->
  <g font-size="10.5" font-weight="600" text-anchor="middle" fill="#4fe3a5">
    <rect x="291" y="158" width="68" height="18" rx="9" fill="rgba(79,227,165,0.10)" stroke="#4fe3a5"/>
    <text x="325" y="171">사람 확인</text>
    <rect x="501" y="158" width="68" height="18" rx="9" fill="rgba(79,227,165,0.10)" stroke="#4fe3a5"/>
    <text x="535" y="171">사람 확인</text>
  </g>

  <!-- legend -->
  <line x1="40" y1="372" x2="960" y2="372" stroke="rgba(242,242,244,0.12)" stroke-width="0.8"/>
  <text x="40" y="390" fill="#a6a6af" font-size="10" letter-spacing="0.08em">범례</text>
  <g font-size="11" fill="#a6a6af">
    <rect x="40" y="404" width="26" height="14" rx="7" fill="rgba(242,242,244,0.03)" stroke="rgba(242,242,244,0.35)"/>
    <text x="74" y="415">시작 · 끝</text>
    <rect x="160" y="404" width="26" height="14" rx="2" fill="#17171b" stroke="rgba(242,242,244,0.6)"/>
    <text x="194" y="415">단계</text>
    <polygon points="268,411 281,404 294,411 281,418" fill="#17171b" stroke="rgba(242,242,244,0.6)"/>
    <text x="302" y="415">판단 분기</text>
    <line x1="392" y1="411" x2="420" y2="411" stroke="#4fe3a5" stroke-width="1.5" marker-end="url(#flow-g)"/>
    <text x="428" y="415">사람에게 넘김</text>
    <line x1="530" y1="411" x2="558" y2="411" stroke="#a6a6af" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#flow-a)"/>
    <text x="566" y="415">다음 조사로 되돌아감</text>
    <rect x="720" y="403" width="40" height="16" rx="8" fill="rgba(79,227,165,0.10)" stroke="#4fe3a5"/>
    <text x="768" y="415">사람이 확인하는 단계</text>
  </g>
</svg>
</body>
</html>
