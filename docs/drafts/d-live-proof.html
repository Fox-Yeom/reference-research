<!doctype html>
<html lang="ko" data-view="board" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 D 살아 있는 교정지 — 레퍼런스 보드</title>
<style>
:root{
  --desk:#e6ebf2;--paper:#fff;--paper-2:#f5f7fb;--ink:#17202b;--ink-2:#455163;--ink-3:#5d6979;--rule:#d5dce6;--rule-2:#e8edf3;
  --blue:#1d5bcc;--blue-deep:#123a82;--blue-soft:#e3ebfb;--green:#15784a;--green-soft:#ddf1e5;--amber:#925400;--amber-soft:#fbeed6;--red:#c02828;--red-soft:#fbe2df;
  --bar:#123a82;--bar-2:#0c2b63;--bar-muted:#c6d4f2;--lit:#ffcf3f;--shadow:0 1px 2px rgba(23,32,43,.06),0 8px 24px rgba(23,32,43,.07);
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme=dark]{
  --desk:#0d1218;--paper:#151c25;--paper-2:#1b2430;--ink:#e8edf3;--ink-2:#b4bfcc;--ink-3:#97a3b2;--rule:#2b3644;--rule-2:#222c38;
  --blue:#8fb2ff;--blue-deep:#c8d8ff;--blue-soft:#1d2b47;--green:#5fd197;--green-soft:#173326;--amber:#f2b55a;--amber-soft:#382a12;--red:#ff8b7f;--red-soft:#3d1d1b;
  --bar:#0a1730;--bar-2:#132449;--bar-muted:#a9bde6;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:120px;-webkit-text-size-adjust:100%;color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.65 var(--sans);word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;transition:background .2s}
::selection{background:#bcd0f7;color:#17202b}
a{color:var(--blue);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:30;background:var(--bar);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.bar-row{max-width:1440px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px}
.brand{font-weight:700;color:#fff;text-decoration:none;white-space:nowrap}.brand span{color:var(--bar-muted);font-weight:500}
.views{display:flex;gap:4px;background:var(--bar-2);padding:3px;border-radius:8px}
.views a{color:var(--bar-muted);text-decoration:none;padding:5px 12px;border-radius:6px;font-size:14px;white-space:nowrap}
.views a[aria-current=page]{background:#fff;color:#123a82;font-weight:600}
.search{margin-left:auto;position:relative;flex:0 1 340px}
.search input{width:100%;font:inherit;font-size:14px;padding:8px 36px 8px 12px;border-radius:7px;border:1px solid transparent;background:rgba(255,255,255,.12);color:#fff;outline:none}
.search input::placeholder{color:var(--bar-muted)}
.search input:focus{background:#fff;color:#17202b}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:12px var(--mono);color:var(--bar-muted);border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:0 5px}
.themebtn{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:7px;padding:6px 10px;font-size:13px}
.themebtn:hover{background:rgba(255,255,255,.1)}
.secnav{border-top:1px solid rgba(255,255,255,.12)}
.secnav .bar-row{padding-top:6px;padding-bottom:6px;gap:4px;overflow-x:auto;scrollbar-width:none}
.secnav a{color:var(--bar-muted);text-decoration:none;font-size:13.5px;padding:4px 10px;border-radius:6px;white-space:nowrap;transition:background .15s,color .15s}
.secnav a:hover,.secnav a[aria-current=true]{color:#fff;background:rgba(255,255,255,.13)}
.secnav small{margin-left:5px;color:#d5e0f7}
#searchinfo{max-width:1440px;margin:12px auto 0;padding:0 24px;color:var(--ink-2);font-size:14px}
/* layout: galley + sticky capture rail */
.wrap{max-width:1440px;margin:0 auto;padding:20px 24px 120px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:start}
.railc{position:sticky;top:112px;background:var(--paper);border-radius:8px;box-shadow:var(--shadow);padding:14px}
.railc h2{font-size:13.5px;margin:0 0 2px}.railc p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2);min-height:2.6em}
.railc button{display:block;width:100%;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;background:var(--paper-2);margin:0 0 8px;position:relative;transition:border-color .2s,transform .2s}.railc button img{transition:opacity .2s}
.railc img{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top;display:block}
.railc button span{position:absolute;left:6px;bottom:6px;font:600 11.5px var(--mono);background:rgba(15,20,27,.82);color:#fff;border-radius:4px;padding:1px 6px}
.railc.focus button img{opacity:.28}
.railc.focus button.lit img{opacity:1}.railc.focus button.lit{border-color:var(--lit);transform:translateX(-4px)}
.sheet{background:var(--paper);border-radius:8px;box-shadow:var(--shadow);margin:0 0 18px;transition:background .2s}
.sheet>header{padding:22px 28px 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sheet>header h2{font-size:20px;margin:0;letter-spacing:-.01em}
.sheet>header p{margin:0;color:var(--ink-2);font-size:14px;flex-basis:100%}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 210px;gap:0 20px;padding:12px 28px;border-top:1px solid var(--rule-2);align-items:start;transition:background .18s}
.row:first-of-type{border-top:0}
.row[data-cites]:hover,.row[data-cites]:focus-within{background:var(--paper-2)}
.row>.lab{color:var(--ink-3);font-size:13.5px;padding-top:2px}
.row>.mg{border-left:1px dashed var(--rule);padding-left:16px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;position:relative;min-height:100%}
/* evidence line in the margin (B's shape on A's page) */
.row.ev>.mg{padding-left:34px}
.row.ev>.mg::before{content:"";position:absolute;left:13px;top:-13px;bottom:-13px;width:5px;background:var(--green);border-radius:2px}
.row.ev.first>.mg::before{top:8px}.row.ev.last>.mg::before{bottom:auto;height:22px}
.row.ev>.mg .stn{position:absolute;left:6px;top:2px;width:19px;height:19px;border-radius:50%;background:var(--paper);border:4px solid var(--green)}
.row.ev>.mg .stn.full{background:var(--green)}
.row.ev>.mg .stn.half{background:linear-gradient(90deg,var(--green) 50%,var(--paper) 50%)}
.row.counter{background:var(--red-soft)}
.row.counter>.lab{color:var(--red);font-weight:600}
.row.counter>.mg{padding-left:34px}
.row.counter>.mg::before{content:"";position:absolute;left:13px;top:-30px;height:44px;width:22px;border-left:5px dashed var(--red);border-bottom:5px dashed var(--red);border-bottom-left-radius:12px}
.row.counter>.mg .stn{position:absolute;left:30px;top:4px;width:17px;height:17px;border-radius:50%;background:var(--red);display:none}
.lede{padding:24px 28px 20px}
.meta{color:var(--ink-3);font-size:13.5px;margin:0 0 4px}
h1{font-size:29px;line-height:1.25;margin:0 0 10px;letter-spacing:-.02em}
.goal{margin:0;font-size:16px;max-width:72ch}.goal b{color:var(--ink-3);font-weight:500;margin-right:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.kpi{text-align:left;border:1px solid var(--rule);background:var(--paper-2);border-radius:8px;padding:12px 14px;transition:transform .15s ease-out,border-color .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:var(--shadow)}
.kpi:active{transform:translateY(0)}
.kpi .k{font-size:13px;color:var(--ink-2);display:block}
.kpi .v{font-size:26px;font-weight:750;letter-spacing:-.02em;display:block;line-height:1.2;margin:2px 0 8px}
.kpi .v small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:4px}
.kpi .split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--rule-2)}
.kpi .split i{display:block;height:100%;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.kpi .hint{display:block;font-size:12.5px;color:var(--ink-3);margin-top:6px}
.answer{font-size:21px;line-height:1.45;font-weight:700;letter-spacing:-.01em;margin:0}
.q{font-size:16px;margin:0}
.evn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--paper-2);border:1px solid var(--rule);font-size:12px;font-weight:700;margin-right:8px;vertical-align:1px}
.mark{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;line-height:1.3}
.mark svg{flex:none;width:20px;height:20px}
.mark svg path{stroke-dasharray:40;stroke-dashoffset:0;transition:stroke-dashoffset .45s cubic-bezier(.2,.8,.2,1)}
.row:hover .mark svg path{animation:draw .5s cubic-bezier(.2,.8,.2,1)}
@keyframes draw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
.mark.strong{color:var(--green)}.mark.medium{color:var(--amber)}.mark.contested{color:var(--red)}.mark.new{color:var(--blue)}.mark.query{color:var(--amber)}.mark.synthetic{color:var(--ink-3)}
.why{font-weight:400;color:var(--ink-2)}
.id{white-space:nowrap;font:600 12px/1 var(--mono);color:var(--blue);background:var(--blue-soft);border:0;border-radius:4px;padding:4px 6px;margin:0 2px;vertical-align:1px;text-decoration:none;display:inline-block;transition:background .15s}
.id:hover{background:var(--rule)}
.id.c{color:var(--ink-2);background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--rule)}
.pick{font-size:12.5px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 10px;color:var(--ink-2);white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .1s}
.pick:hover{border-color:var(--blue);color:var(--blue)}.pick:active{transform:scale(.96)}
.pick.is-on{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.btn{font-size:14px;font-weight:600;border:0;border-radius:7px;padding:9px 14px;background:#1d5bcc;color:#fff;transition:transform .12s ease-out,background .15s}
.btn:hover{background:#123a82}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--blue-soft);color:var(--blue-deep)}
.btn.is-done{background:#15784a;color:#fff}
.seg{display:inline-flex;gap:2px;background:var(--paper-2);border:1px solid var(--rule);border-radius:8px;padding:2px}
.seg button{border:0;background:none;border-radius:6px;padding:4px 11px;font-size:13px;color:var(--ink-2);transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toolbar{padding:4px 28px 14px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.tag{display:inline-block;font-size:12.5px;color:var(--ink-2);background:var(--paper-2);border-radius:4px;padding:1px 7px;margin:2px 4px 2px 0}
/* captures: hover flips through frames */
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding:0 28px 26px}
.cap{display:flex;flex-direction:column;gap:7px;min-width:0}
.cap .shot{display:block;padding:0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--paper-2);aspect-ratio:16/10;position:relative;transition:transform .18s ease-out,box-shadow .18s}
.cap .shot:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cap .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transition:opacity .35s}
.cap .shot img:not(.on){opacity:0}
.dots{position:absolute;left:8px;bottom:8px;display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.35);transition:background .2s}
.dots i.on{background:#fff}
.cap h3{font-size:15.5px;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cap h3 small{color:var(--ink-3);font-weight:400;font-size:13px}
.cap .line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.role{font-size:12.5px;font-weight:600;padding:1px 7px;border-radius:4px}
.role.direct{color:var(--blue-deep);background:var(--blue-soft)}.role.indirect{color:var(--amber);background:var(--amber-soft)}
.axis h3{font-size:17px;margin:0 0 2px}.axis .lbl{color:var(--ink-3);font-size:13px}
.verdict{margin:8px 0 0;padding:7px 10px;background:var(--blue-soft);border-radius:5px;font-size:14px;color:var(--blue-deep)}
/* pattern stops: B's line with a stop per product */
.stops{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:14px 0 2px;padding:0;list-style:none;position:relative}
.stops::before{content:"";position:absolute;left:10%;right:10%;top:9px;height:5px;border-radius:3px;background:var(--green)}
.stops li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:12.5px;color:var(--ink-2);min-width:0}
.stops .stn{width:22px;height:22px;border-radius:50%;background:var(--paper);border:4.5px solid var(--green);position:relative;z-index:1;padding:0;transition:transform .15s}
.stops .stn.full{background:var(--green)}.stops li.off .stn{border-color:var(--rule)}
.stops .stn:hover{transform:scale(1.18)}
.stops b{color:var(--ink);font-size:13px}
.cover{font-size:13px}.cover b{font-size:18px;color:var(--ink)}
.meter{height:6px;border-radius:3px;background:var(--rule-2);overflow:hidden;width:100%}.meter i{display:block;height:100%;background:var(--green)}
.ctext{margin:0}.src{margin-top:4px;font-size:13px;color:var(--ink-3)}
.plain{margin:0;padding-left:18px}
.small{font-size:13.5px;color:var(--ink-2)}
.rounds{list-style:none;margin:0;padding:0}
.rounds li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--rule-2)}
.rounds li:first-child{border-top:0}
.rounds .k{font:700 13px var(--mono);color:var(--blue)}
.nomatch{margin:0;padding:12px 28px 18px;color:var(--ink-2);font-size:14px}
[data-group].is-empty>.row,[data-group].is-empty>.caps,[data-group].is-empty>.toolbar,[data-group].is-empty>.list{display:none}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%,30%{background:var(--amber-soft)}100%{background:transparent}}
/* home */
.spark{display:block;width:100%;height:36px;margin-top:6px}
.cal{display:grid;grid-template-rows:repeat(7,16px);grid-auto-flow:column;grid-auto-columns:16px;gap:4px;padding:6px 28px 6px;overflow-x:auto}
.cal i{border-radius:3px;background:var(--rule-2);position:relative;font-style:normal}
.cal i[data-n]{background:var(--blue)}
.cal i[data-n="1"]{background:color-mix(in srgb,var(--blue) 45%,var(--paper))}
.cal i:hover::after{content:attr(title);position:absolute;bottom:115%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--paper);font-size:12px;font-style:normal;padding:3px 7px;border-radius:5px;z-index:2}
.calnote{padding:2px 28px 18px;font-size:13px;color:var(--ink-2)}
.led h3{font-size:17px;margin:0}.led h3 a{color:var(--ink);text-decoration:none}.led h3 a:hover{text-decoration:underline}
.led .sub{font-size:13px;color:var(--ink-3);margin:1px 0 6px}
.led .qq{margin:0;color:var(--ink-2);font-size:14px}.led .ans{margin:4px 0 0;font-weight:600}
.led .thumbs{display:flex;gap:4px;margin-top:8px}.led .thumbs img{width:64px;height:40px;object-fit:cover;object-position:top;border-radius:3px;border:1px solid var(--rule);display:block}
.led .thumbs button{padding:0;border:0;background:none}
.pill{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:999px;background:var(--paper-2);border:1px solid var(--rule);color:var(--ink-2);margin:2px 4px 0 0;transition:border-color .15s,background .15s}
.pill b{color:var(--ink)}
button.pill:hover{border-color:var(--blue)}
.net svg{display:block;width:100%;height:auto}
.net .e{stroke:var(--rule);stroke-width:3;transition:stroke .2s,stroke-width .2s}
.net .e.lit{stroke:var(--ink);stroke-width:4}
.net .n{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.net .n.lit{transform:scale(1.25)}
.net text{fill:var(--ink-2);font-size:11.5px;font-family:var(--sans)}
.row.dim{filter:saturate(.2)}.row.dim img{opacity:.45}
.prompts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
/* tray + viewer */
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 32px);background:#17202b;color:#fff;border-radius:10px;padding:10px 12px 10px 16px;box-shadow:0 8px 28px rgba(0,0,0,.3);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
.tray-n{font-weight:600;font-size:14px}.tray-ids{display:flex;gap:4px;flex-wrap:wrap}
.tray-id{font:600 12px var(--mono);background:rgba(255,255,255,.14);border-radius:4px;padding:3px 4px 3px 7px}
.tray-id button{border:0;background:none;color:#c9d2de;padding:0 3px;font-size:14px;line-height:1}
.tray-copy{border:0;border-radius:6px;background:#fff;color:#17202b;font-weight:600;padding:7px 12px}.tray-copy.is-done{background:#bff0d2}
.tray-clear{border:0;background:none;color:#c9d2de;font-size:13px}
.vw{border:0;padding:0;width:100vw;height:100vh;max-width:none;max-height:none;background:#0f141b;color:#e9edf2}
.vw::backdrop{background:rgba(10,14,20,.7)}
.vw[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.vw-top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #263040;flex-wrap:wrap}
.vw-title{margin-right:auto}.vw-count{color:#a6b1c2;font-size:13px}
.vw-top button,.vw-top a{font-size:13px;color:#e9edf2;background:#1d2633;border:0;border-radius:6px;padding:6px 11px;text-decoration:none}
.vw-top button:hover,.vw-top a:hover{background:#2a3546}.vw-top button:disabled{opacity:.4}
.vw-body{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.vw-stage{position:relative;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:16px}
.vw-stage img{max-width:100%;height:auto;border-radius:4px}
.vw-prev,.vw-next{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(29,38,51,.92);color:#fff;font-size:22px}
.vw-prev{left:14px}.vw-next{right:14px}
.vw-side{overflow:auto;border-left:1px solid #263040;padding:16px 20px;font-size:14px;color:#cfd7e2}
.vw-side h3{font-size:13px;color:#a6b1c2;margin:18px 0 6px}
.vw-side dl{margin:0}.vw-side dt{color:#8fa2bd;font-size:12.5px;margin-top:8px}.vw-side dd{margin:0}
.vw-side ul{padding-left:18px;margin:0}.vw-side li{margin:4px 0}
.vw-meta{margin:0;color:#a6b1c2;font-size:13px}
.vw-tags span{display:inline-block;font-size:12px;background:#1d2633;border-radius:4px;padding:1px 7px;margin:6px 4px 0 0}
.vw-side .pick{margin-top:14px;background:#1d2633;border-color:#33415a;color:#e9edf2}.vw-side .pick.is-on{background:#1d5bcc}
.vw-strip{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #263040;overflow-x:auto}
.vw-strip button{padding:0;border:2px solid transparent;border-radius:4px;background:none;opacity:.5}.vw-strip button.is-on{opacity:1;border-color:#7ea6f2}
.vw-strip img{height:56px;display:block;border-radius:2px}
footer{max-width:1440px;margin:0 auto;padding:0 24px 40px;color:var(--ink-3);font-size:13px}
@media (max-width:1180px){.wrap{grid-template-columns:minmax(0,1fr)}.railc{display:none}}
@media (max-width:1000px){
  .row{grid-template-columns:84px minmax(0,1fr)}
  .row>.mg{grid-column:2;border-left:0;flex-direction:row;flex-wrap:wrap;gap:6px 14px;min-height:0;margin-top:6px}
  .row.ev>.mg,.row.counter>.mg{padding-left:0}.row.ev>.mg::before,.row.counter>.mg::before,.row.ev>.mg .stn{display:none}
  .kpis{grid-template-columns:1fr 1fr}
}

  const sp = Draft.spark(weeks, 200, 36), kpi = (k, v, small, hint, jump) => `<button type="button" class="kpi" data-jump="${jump}"><span class="k">${k}</span><span class="v num">${v}<small>${small}</small></span>${hint}</button>`;
  const sparkSvg = `<svg class="spark" viewBox="0 0 200 36" preserveAspectRatio="none" aria-hidden="true"><path d="${sp.area}" fill="var(--blue-soft)"/><path d="${sp.line}" fill="none" stroke="var(--blue)" stroke-width="2"/></svg>`;
  const lede = `<section class="sheet lede" id="top"><p class="meta">레퍼런스 라이브러리 · 2026-11-13 기준 · 가상 예시 조사 4개 포함</p><h1>조사해 둔 레퍼런스</h1>
<p class="goal">최근 조사가 먼저 보입니다. 줄에 마우스를 올리면 오른쪽 연결도에서 그 조사와 이어진 레퍼런스가 밝아집니다.</p>
<div class="kpis">${kpi("조사", C.length, `회차 ${totals.runs}`, `<span class="hint">최근 8주 새 발견</span>${sparkSvg}`, "cols")}${kpi("레퍼런스", totals.refs, `겹침 ${H.shared.length}`, `<span class="split"><i style="width:${(H.shared.length / 10) * 100}%;background:var(--blue)"></i></span><span class="hint">눌러서 겹치는 것 보기</span>`, "across")}${kpi("발견", totals.claims, `이번 주 ${weeks.at(-1)}`, `<span class="split"><i style="width:${(weeks.at(-1) / Math.max(...weeks)) * 100}%;background:var(--green)"></i></span><span class="hint">주간 최대 ${Math.max(...weeks)}개 대비</span>`, "activity")}${kpi("추가 질문", totals.open, "답 없음", `<span class="split"><i style="width:100%;background:var(--amber)"></i></span><span class="hint">눌러서 질문으로 이동</span>`, "openq")}</div>
<div class="prompts"><button type="button" class="btn" data-copy="new">새 조사 시작 — 프롬프트 복사</button><button type="button" class="btn ghost" data-copy="ask">라이브러리에 묻기 — 프롬프트 복사</button></div></section>`;
  // calendar: 9 weeks x 7 days, one cell per day, filled on days a run happened
  const end = Draft.day("2026-11-13"), runsByDay = {};
  C.forEach((c) => (c.runsAt || []).forEach((d, i) => { (runsByDay[d] ??= []).push(`${c.title}${c.synthetic ? " (가상)" : ""} R${i + 1} · 새 발견 ${c.newByRun[i]}`); }));
  const cells = []; const first = new Date((end - 62) * 864e5).getUTCDay(); for (let k = 0; k < first; k++) cells.push(`<i style="visibility:hidden"></i>`); for (let i = 62; i >= 0; i--) { const d = new Date((end - i) * 864e5).toISOString().slice(0, 10), r = runsByDay[d]; cells.push(`<i${r ? ` data-n="${r.length}" title="${d.slice(5)} ${esc(r.join(" / "))}"` : ` title="${d.slice(5)} 조사 없음"`}></i>`); }
  const activity = sheet("activity", "조사한 날", "9주 동안 조사 회차가 있었던 날입니다. 칸에 마우스를 올리면 그날 무엇을 했는지 보입니다.", `<div class="cal" role="img" aria-label="9주 동안 조사한 날, 칸 하나가 하루">${cells.join("")}</div><p class="calnote">조사한 날 ${Object.keys(runsByDay).length}일 · 회차 ${totals.runs}개 · 가장 최근 11.13</p>`, false);
  const topics = ["전체", ...new Set(C.map((c) => c.topic))];
  const ledger = sheet("cols", "조사", "주제로 거를 수 있습니다. 거르면 줄이 제자리에서 움직입니다.",
    `<div class="toolbar"><div class="seg" role="group" aria-label="주제">${topics.map((t, i) => `<button type="button" data-topic="${t}" aria-pressed="${i === 0}">${t} <span class="num">${i ? C.filter((c) => c.topic === t).length : C.length}</span></button>`).join("")}</div></div><div class="list" id="ledger">` +
    C.map((c) => row(`<span class="num small">${c.date.slice(5).replace("-", ".")}</span>`, `<div class="led"><h3>${c.synthetic ? esc(c.title) : `<a href="#">${esc(c.title)}</a>`}</h3><p class="sub">${esc(c.topic)} · ${esc(c.domain)}</p>
<p class="qq">${esc(c.question)}</p><p class="ans">${esc(c.answer)}</p>
<div><span class="pill"><b class="num">${c.refs}</b> 레퍼런스</span><span class="pill"><b class="num">${c.claims}</b> 발견</span><span class="pill"><b class="num">${c.runs}</b> 회차</span></div>
${c.thumbs ? `<div class="thumbs">${c.thumbs.map((t, k) => `<button type="button" data-open="${B.refs[[0, 1, 3][k]].id}" aria-label="캡처 열기"><img src="${t}" alt=""></button>`).join("")}</div>` : ""}</div>`,
      [c.open ? mark("query", `추가 질문 ${c.open}개`) : mark("strong", "열린 질문 없음"), c.mixed ? mark("contested", "근거 엇갈림", "4 대 3") : "", c.synthetic ? mark("synthetic", "가상 예시") : mark("new", "최근 조사", "R1")].join(""),
      "", ` data-search="${esc([c.title, c.question, c.answer, c.topic, c.domain].join(" "))}" data-t="${c.topic}" data-col="${c.id}"`)).join("") + `</div>`);
  const across = sheet("across", "조사 사이에 겹치는 것", "패턴 칩에 마우스를 올리면 그 패턴이 나온 조사 줄이 밝아집니다.",
    H.patterns.map((p) => row("패턴", `<h3 style="font-size:16px;margin:0">${esc(p.question)}</h3><span class="small">${esc(p.label)}</span>${p.verdict ? `<p class="verdict">결론: ${esc(p.verdict)}</p>` : ""}
<div style="margin-top:6px">${Object.entries(p.in).map(([k, n]) => `<button type="button" class="pill" data-hl="${k}">${ctitle(k)} <b class="num">${n}</b></button>`).join("")}</div>`, p.verdict ? mark("strong", "결론 있음") : mark("query", "결론 없음", "verdict 미기록"), "", ` data-search="${esc(p.label + " " + p.question)}"`)).join("") +
    H.shared.map((s) => row("레퍼런스", `${id(s.ref)} <b>${esc(s.product)}</b> — ${s.in.map((k) => `<button type="button" class="pill" data-hl="${k}">${ctitle(k)}</button>`).join("")}`, mark("new", `조사 ${s.in.length}개에 걸침`), "", ` data-search="${esc(s.product)}"`)).join(""));
  const openq = sheet("openq", "추가 질문", "조사마다 아직 답하지 않은 질문입니다.",
    B.open.map((o) => row(`<span class="small">메모 앱 요금제</span>`, `<p class="q">${esc(o.text)}</p><p class="src">${esc(o.why)}</p>`, mark("query", "답 없음"), "", ` data-search="${esc(o.text)}"`)).join("") +
    row("", `<button type="button" class="btn ghost" data-copy="continue">이 질문들로 이어서 하기 — 프롬프트 복사</button>`));
  document.getElementById("app").innerHTML = lede + ledger + activity + across + openq + Draft.trayHtml() + Draft.viewerHtml();
  setNav([["cols", "조사", C.length], ["activity", "조사한 날", null], ["across", "겹치는 것", H.patterns.length + H.shared.length], ["openq", "추가 질문", totals.open]]);
  // home rail: collections (left) to shared references (right); hovering a ledger row lights its edges
  const r = document.getElementById("railc"); r.hidden = false;
  const yC = (i) => 22 + i * 46, yS = (k) => 60 + k * 90;
  let svg = `<svg viewBox="0 0 200 250" role="img" aria-label="조사와 겹치는 레퍼런스 연결도">`;
  H.shared.forEach((s, k) => s.in.forEach((cid) => { const i = C.findIndex((c) => c.id === cid); svg += `<path class="e" data-c="${cid}" data-s="${s.ref}" d="M24 ${yC(i)} C 100 ${yC(i)}, 100 ${yS(k)}, 166 ${yS(k)}" fill="none"/>`; }));
  C.forEach((c, i) => { svg += `<circle class="n" data-c="${c.id}" cx="24" cy="${yC(i)}" r="8" fill="var(--paper)" stroke="var(--blue)" stroke-width="4"/><text x="38" y="${yC(i) + 4}">${esc(c.title.slice(0, 6))}…${c.synthetic ? " (가상)" : ""}</text>`; });
  H.shared.forEach((s, k) => { svg += `<circle class="n" data-s="${s.ref}" cx="166" cy="${yS(k)}" r="9" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/><circle cx="166" cy="${yS(k)}" r="3.5" fill="var(--ink)"/><text x="160" y="${yS(k) + 26}" text-anchor="middle">${s.ref} ${esc(s.product)}</text>`; });
  r.innerHTML = `<h2>연결도</h2><p id="railnote">여러 조사에 함께 쓰인 레퍼런스(이중 원)와 조사(왼쪽 점)를 잇습니다.</p><div class="net">${svg}</svg></div>`;
  const light = (cid) => {
    r.querySelectorAll(".e").forEach((e) => e.classList.toggle("lit", e.dataset.c === cid));
    r.querySelectorAll(".n").forEach((n) => n.classList.toggle("lit", n.dataset.c === cid || (cid && [...r.querySelectorAll(`.e[data-c="${cid}"]`)].some((e) => e.dataset.s === n.dataset.s))));
    document.querySelectorAll("#ledger .row").forEach((row) => row.classList.toggle("dim", !!cid && row.dataset.col !== cid));
    const n = H.shared.filter((s) => s.in.includes(cid)).length;
    document.getElementById("railnote").textContent = cid ? `${col(cid).title}${col(cid).synthetic ? " (가상)" : ""}: 겹치는 레퍼런스 ${n}개` : "여러 조사에 함께 쓰인 레퍼런스(이중 원)와 조사(왼쪽 점)를 잇습니다.";
  };
  const app = document.getElementById("app");
  app.onmouseover = (e) => { const t = e.target.closest("[data-col],[data-hl]"); light(t ? t.dataset.col || t.dataset.hl : null); };
  app.onfocusin = (e) => { const t = e.target.closest("[data-col],[data-hl]"); light(t ? t.dataset.col || t.dataset.hl : null); };
  app.onmouseleave = () => light(null);
  seg("[data-topic]", (v) => Draft.flip(document.getElementById("ledger"), () => document.querySelectorAll("#ledger .row").forEach((el) => { el.style.display = v === "전체" || el.dataset.t === v ? "" : "none"; })));
  document.querySelectorAll(".kpi").forEach((k) => k.addEventListener("click", () => document.getElementById(k.dataset.jump)?.scrollIntoView({ block: "start" })));
}
Draft.theme(document.getElementById("theme"));
Draft.route(drawBoard, drawHome);
Draft.bindSearch(document.getElementById("q"));
</script>
</body>
</html>
