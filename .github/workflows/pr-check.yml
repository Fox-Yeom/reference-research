name: PR 검증

# pull_request_target은 기본 브랜치의 워크플로로 돈다. 검사기는 통합 브랜치의 최신 커밋에서 꺼낸다.
# 리뷰를 거쳐 병합된 판만 실행하므로 PR이나 스택 상위 브랜치가 검사기를 고쳐도 판정은 바뀌지 않는다.
# PR 코드는 체크아웃하거나 실행하지 않는다. PR 커밋은 fetch해서 git 데이터로만 읽는다.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_BRANCH: main
      INTEGRATION_BRANCH: develop
    steps:
      # 비공개 저장소에서 PR head를 fetch하려면 인증이 필요하므로 자격 증명을 남긴다. 토큰은 읽기 전용이다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.INTEGRATION_BRANCH }}
          fetch-depth: 0
      - name: PR 커밋 가져오기 (체크아웃하지 않음)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
      - name: 판정
        # 표식만 있고 검사기가 없으면 검사기가 지워진 것이므로 실패시킨다. 둘 다 없으면 도입 전이다.
        run: if [ -f .github/convention/pr_check.py ]; then python3 .github/convention/pr_check.py; elif [ -f .commit-convention ]; then echo "::error::통합 브랜치에 표식이 있는데 검사기(.github/convention/pr_check.py)가 없다"; exit 1; else echo "::notice::통합 브랜치에 표식과 검사기가 없어 건너뜀(도입 전)"; fi
