<!doctype html>
<html lang="ko" data-view="board">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 B 노선도 — 레퍼런스 보드</title>
<style>
:root{
  --bg:#fff;--rail:#f3f5f8;--ink:#111827;--ink-2:#414b5a;--ink-3:#5b6575;--rule:#dfe3ea;--rule-2:#eef1f5;
  --l1:#13843f;--l1-soft:#e2f4e8;--l2:#b45309;--l3:#1660c7;--l4:#c2255c;--l5:#8a5a2b;
  --red:#cf2a1d;--red-soft:#fde8e5;--amber:#9a5a00;--amber-soft:#fcf0dc;--link:#1660c7;
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
::selection{background:#cdeedd}
a{color:var(--link);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--l3);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.frame{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
/* rail: section links as stations on a line */
.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--rail);border-right:1px solid var(--rule);padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:800;color:var(--ink);text-decoration:none;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.views{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e4e8ee;padding:3px;border-radius:9px}
.views a{text-align:center;color:var(--ink-2);text-decoration:none;padding:6px 4px;border-radius:7px;font-size:13.5px}
.views a[aria-current=page]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(17,24,39,.1)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:14px;padding:9px 34px 9px 12px;border:1px solid var(--rule);border-radius:9px;background:#fff;color:var(--ink);outline:none}
.search input:focus{border-color:var(--l3);box-shadow:0 0 0 3px #d6e4fa}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:12px var(--mono);color:var(--ink-3);border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.line-nav{position:relative;margin:0;padding:0;list-style:none;--lc:var(--l1)}
.line-nav::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:6px;border-radius:3px;background:var(--lc)}
.line-nav li{position:relative}
.line-nav a{display:flex;align-items:center;gap:12px;padding:7px 0;color:var(--ink-2);text-decoration:none;font-size:14.5px}
.line-nav a::before{content:"";flex:none;width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--lc);position:relative;z-index:1;transition:transform .15s ease-out}
.line-nav a:hover{color:var(--ink)}.line-nav a:hover::before{transform:scale(1.12)}
.line-nav a[aria-current=true]{color:var(--ink);font-weight:700}
.line-nav a[aria-current=true]::before{background:var(--lc)}
.line-nav small{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rail .foot{margin-top:auto;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.legend{display:grid;gap:6px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:8px}
/* stations used inline */
.st{display:inline-block;width:16px;height:16px;border-radius:50%;border:3.5px solid var(--lc,var(--l1));background:#fff;flex:none;vertical-align:-3px}
.st.full{background:var(--lc,var(--l1))}
.st.half{background:linear-gradient(90deg,var(--lc,var(--l1)) 50%,#fff 50%)}
.st.xfer{border-color:var(--ink);box-shadow:0 0 0 2.5px #fff,0 0 0 5px var(--ink);width:14px;height:14px}
.st.red{--lc:var(--red)}
main{min-width:0}
#searchinfo{margin:0;padding:10px 40px;color:var(--ink-2);font-size:14px;border-bottom:1px solid var(--rule)}
/* header band in the collection's line colour */
.band{background:var(--lc,var(--l1));color:#fff;padding:28px 40px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,420px);gap:20px 40px;align-items:end}
.band .meta{margin:0 0 6px;font-size:13.5px;color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:#fff;color:var(--lc,var(--l1));font-weight:800;font-size:14px}
.band h1{margin:0 0 8px;font-size:30px;line-height:1.25;letter-spacing:-.02em}
.band .goal{margin:0;max-width:64ch;font-size:15.5px;color:#fff}
.band .goal b{font-weight:600;color:#fff;margin-right:6px}
.runline{background:rgba(0,0,0,.16);border-radius:12px;padding:14px 16px}
.runline h2{margin:0 0 10px;font-size:13.5px;font-weight:600;color:#e3f5ea}
.runline ol{display:flex;margin:0;padding:0;list-style:none;position:relative}
.runline ol::before{content:"";position:absolute;left:8px;right:8px;top:8px;height:5px;border-radius:3px;background:#fff}
.runline li{flex:1;position:relative;font-size:12.5px;line-height:1.4;color:#f1fbf4;padding-right:6px}
.runline li i{display:block;width:21px;height:21px;border-radius:50%;background:var(--lc,var(--l1));border:4px solid #fff;margin-bottom:6px;position:relative}
.runline li b{display:block;color:#fff;font-size:13px}
.runline li.stop i{background:#fff}
.counts{display:flex;gap:6px 22px;flex-wrap:wrap;margin:14px 0 0;padding:0;list-style:none;font-size:14px;color:#fff}
.counts b{color:#fff;font-size:18px;margin-right:3px}
/* sections */
.sec{padding:30px 40px 8px}
.sec>h2{font-size:21px;margin:0 0 4px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.sec>p.desc{margin:0 0 16px;color:var(--ink-2);font-size:14px;max-width:80ch}
.concl{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
.qa dt{font-size:13px;color:var(--ink-3);margin:12px 0 2px}.qa dt:first-child{margin-top:0}
.qa dd{margin:0}
.qa .ans{font-size:20px;font-weight:700;line-height:1.45;letter-spacing:-.01em}
/* evidence as a line with stations, counter-evidence as a red branch */
.evline{margin:0;padding:0;list-style:none;position:relative;--lc:var(--l1)}
.evline>li{position:relative;padding:0 0 14px 34px}
.evline>li::before{content:"";position:absolute;left:8px;top:6px;bottom:-6px;width:5px;background:var(--lc)}
.evline>li:last-child::before{display:none}
.evline>li>.st{position:absolute;left:2px;top:3px}
.evline .t{display:block}
.evline .s{font-size:12.5px;font-weight:700}
.evline .s.strong{color:var(--l1)}.evline .s.medium{color:var(--amber)}
.branch{margin:8px 0 0 0;padding:10px 12px 10px 34px;position:relative;background:var(--red-soft);border-radius:10px}
.branch::before{content:"";position:absolute;left:-24px;top:-4px;width:36px;height:22px;border-left:5px solid var(--red);border-bottom:5px solid var(--red);border-bottom-left-radius:14px}
.branch .st{position:absolute;left:8px;top:12px}
.branch b{color:#a61b10;font-size:13px;display:block}
.id{white-space:nowrap;font:700 12px/1 var(--mono);color:var(--link);background:#e6eefb;border:0;border-radius:5px;padding:4px 6px;margin:0 2px;vertical-align:1px;text-decoration:none;display:inline-block}
.id:hover{background:#d3e1f8}
.id.c{color:var(--ink-2);background:var(--rule-2)}
.pick{font-size:12.5px;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:3px 10px;color:var(--ink-2);white-space:nowrap}
.pick:hover{border-color:var(--ink);color:var(--ink)}
.pick.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{font-size:14px;font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:var(--ink);color:#fff;transition:transform .12s ease-out,background .15s}
.btn:hover{background:#2b3444}.btn:active{transform:translateY(1px)}
.btn.line{background:var(--l1)}.btn.line:hover{background:#0e6c33}
.btn.out{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}.btn.out:hover{background:var(--rule-2)}
.btn.is-done{background:var(--l1);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{font-size:13px;border:1.5px solid var(--rule);background:#fff;border-radius:999px;padding:4px 12px;color:var(--ink-2)}
.chip[aria-pressed=true]{border-color:var(--ink);color:var(--ink);font-weight:700}
/* captures: big frames first, the user skims these */
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.gal{min-width:0}
.gal .shot{display:block;width:100%;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--rule-2);aspect-ratio:3/2;box-shadow:0 1px 2px rgba(17,24,39,.08),0 0 0 1px var(--rule)}
.gal .shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .25s ease-out}
.gal .shot:hover img{transform:scale(1.025)}
.gal .strip{display:flex;gap:6px;margin-top:8px}
.gal .strip button{flex:1;padding:0;border:0;background:none;border-radius:6px;overflow:hidden;aspect-ratio:16/10;box-shadow:0 0 0 1px var(--rule)}
.gal .strip img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.gal h3{margin:10px 0 2px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gal h3 small{font-weight:400;color:var(--ink-3);font-size:13px}
.gal .line{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.role{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.role.indirect .st{background:#fff;border-style:dashed}
.tag{display:inline-block;font-size:12.5px;color:var(--ink-2);background:var(--rule-2);border-radius:5px;padding:1px 7px;margin:4px 4px 0 0}
/* pattern lines: one line per question, a stop per product, filled where the product uses it */
.pline{border:1px solid var(--rule);border-radius:14px;padding:18px 22px;margin:0 0 14px}
.pline h3{margin:0;font-size:17px}
.pline .lbl{font-size:13px;color:var(--ink-3)}
.pline .verdict{margin:8px 0 0;font-size:14px;font-weight:600;color:var(--l1)}
.stops{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:16px 0 0;padding:0;list-style:none;position:relative;--lc:var(--l1)}
.stops::before{content:"";position:absolute;left:10%;right:10%;top:92px;height:6px;border-radius:3px;background:var(--lc)}
.stops li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:13px;min-width:0;padding:0 4px}
.stops li button{padding:0;border:0;background:none;border-radius:6px;overflow:hidden;width:100%;max-width:150px;aspect-ratio:16/10;box-shadow:0 0 0 1px var(--rule)}
.stops li img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.stops li .st{width:22px;height:22px;border-width:4.5px;position:relative;z-index:1}
.stops li.off{color:var(--ink-3)}.stops li.off button{opacity:.38}
.stops li.off .st{border-color:#b9c0cc}
.stops b{font-size:13.5px}
.stops small{color:var(--ink-2);line-height:1.4}
.cover{font-size:13px;color:var(--ink-2);margin-left:auto;font-weight:400}.cover b{color:var(--ink);font-size:17px}
/* claims table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--ink)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr:hover td{background:#f8fafc}
.tbl .str{white-space:nowrap;font-weight:700;font-size:13px}
.tbl .str.strong{color:var(--l1)}.tbl .str.medium{color:var(--amber)}
.tbl .x{display:block;color:var(--red);font-size:12.5px;font-weight:700}
.nomatch{margin:0 0 16px;padding:12px 14px;background:var(--rule-2);border-radius:10px;color:var(--ink-2);font-size:14px}
[data-group].is-empty .gallery,[data-group].is-empty .tbl,[data-group].is-empty .chips,[data-group].is-empty .pline,[data-group].is-empty .cards,[data-group].is-empty .list{display:none}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule)}
.list li .st{margin-top:5px}
.list p{margin:0}.list .small{font-size:13.5px;color:var(--ink-2)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.twocol h3{font-size:15px;margin:0 0 4px}
.rounds{display:flex;gap:0;margin:0;padding:0;list-style:none;position:relative;--lc:var(--l1)}
.rounds::before{content:"";position:absolute;left:11px;right:11px;top:9px;height:6px;border-radius:3px;background:var(--lc)}
.rounds li{flex:1;position:relative;padding-right:14px;font-size:13.5px;color:var(--ink-2)}
.rounds li .st{width:24px;height:24px;border-width:5px;margin-bottom:8px;position:relative}
.rounds li b{display:block;color:var(--ink)}
/* home network */
.net{border:1px solid var(--rule);border-radius:14px;padding:16px 18px 10px;overflow:hidden}
.net svg{display:block;width:100%;height:auto}
.net svg text{font-family:var(--sans)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{border:1px solid var(--rule);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .top{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.card .top .badge{background:var(--lc);color:#fff}
.card h3{margin:0;font-size:16px;line-height:1.35}
.card h3 a{color:var(--ink);text-decoration:none}.card h3 a:hover{text-decoration:underline}
.card .body{padding:8px 16px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .sub{font-size:12.5px;color:var(--ink-3)}
.card .q{margin:0;font-size:14px;color:var(--ink-2)}
.card .a{margin:0;font-weight:700}
.card .a.mixed{color:var(--red)}
.card .foot2{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:auto;padding-top:8px;border-top:1px solid var(--rule-2)}
.card .foot2 b{color:var(--ink)}
.card .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--rule)}
.card .thumbs button{padding:0;border:0;aspect-ratio:16/10;overflow:hidden;background:none}
.card .thumbs img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.synth{font-size:12px;font-weight:700;color:var(--ink-3);border:1.5px dashed #9aa3b1;border-radius:999px;padding:1px 8px;margin-left:auto;white-space:nowrap}
.prompts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hband{--lc:#1f2937}
.hband .meta{color:#cfd6e0}.hband .goal{color:#e5e9ef}.hband .counts{color:#cfd6e0}
/* tray */
.tray{position:fixed;left:calc(50% + 134px);transform:translateX(-50%);bottom:16px;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 300px);background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px rgba(17,24,39,.3)}
.tray-n{font-weight:700;font-size:14px}.tray-ids{display:flex;gap:4px;flex-wrap:wrap}
.tray-id{font:700 12px var(--mono);background:rgba(255,255,255,.15);border-radius:5px;padding:3px 4px 3px 7px}
.tray-id button{border:0;background:none;color:#cbd2dc;padding:0 3px;font-size:14px;line-height:1}
.tray-copy{border:0;border-radius:8px;background:var(--l1);color:#fff;font-weight:700;padding:7px 12px}
.tray-clear{border:0;background:none;color:#cbd2dc;font-size:13px}
/* viewer */
.vw{border:0;padding:0;width:100vw;height:100vh;max-width:none;max-height:none;background:#0e1116;color:#eef1f5}
.vw::backdrop{background:rgba(0,0,0,.7)}
.vw[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.vw-top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:4px solid var(--l1);flex-wrap:wrap}
.vw-title{margin-right:auto}.vw-count{color:#aab3c0;font-size:13px}
.vw-top button,.vw-top a{font-size:13px;color:#eef1f5;background:#1e242d;border:0;border-radius:999px;padding:6px 12px;text-decoration:none}
.vw-top button:hover,.vw-top a:hover{background:#2c3440}.vw-top button:disabled{opacity:.4}
.vw-body{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.vw-stage{position:relative;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:16px}
.vw-stage img{max-width:100%;height:auto;border-radius:6px}
.vw-prev,.vw-next{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:4px solid var(--l1);background:#fff;color:var(--ink);font-size:22px;font-weight:700}
.vw-prev{left:14px}.vw-next{right:14px}
.vw-side{overflow:auto;border-left:1px solid #262d38;padding:16px 20px;font-size:14px;color:#d3d9e1}
.vw-side h3{font-size:13px;color:#aab3c0;margin:18px 0 6px}
.vw-side dl{margin:0}.vw-side dt{color:#93a0b2;font-size:12.5px;margin-top:8px}.vw-side dd{margin:0}
.vw-side ul{padding-left:18px;margin:0}.vw-side li{margin:4px 0}
.vw-meta{margin:0;color:#aab3c0;font-size:13px}
.vw-tags span{display:inline-block;font-size:12px;background:#1e242d;border-radius:5px;padding:1px 7px;margin:6px 4px 0 0}
.vw-side .pick{margin-top:14px;background:#1e242d;border-color:#384252;color:#eef1f5}.vw-side .pick.is-on{background:var(--l1);border-color:var(--l1)}
.vw-strip{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #262d38;overflow-x:auto}
.vw-strip button{padding:0;border:2px solid transparent;border-radius:6px;background:none;opacity:.5}
.vw-strip button.is-on{opacity:1;border-color:#4fd18a}
.vw-strip img{height:56px;display:block;border-radius:4px}
footer{padding:30px 40px 90px;color:var(--ink-3);font-size:13px}
@media (min-width:1500px){.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}.sec,.band{padding-left:56px;padding-right:56px}}
@media (max-width:1100px){
  .frame{display:block}
  .rail{position:sticky;height:auto;z-index:30;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 20px;border-right:0;border-bottom:1px solid var(--rule)}
  .rail .legend,.rail .foot{display:none}
  .search{flex:1 1 220px}
  .line-nav{flex-basis:100%;display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .line-nav::before{left:12px;right:12px;top:16px;bottom:auto;width:auto;height:5px}
  .line-nav a{flex-direction:column;gap:2px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
  .line-nav small{margin:0}
  .tray{left:50%;max-width:calc(100vw - 32px)}
  .band{grid-template-columns:1fr}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .band,.sec{padding-left:16px;padding-right:16px}.rail{padding:10px 16px}
  .band h1{font-size:24px}
  .concl{grid-template-columns:1fr;padding:16px}
  .gallery{grid-template-columns:1fr}
  .twocol{grid-template-columns:1fr}
  .stops{grid-template-columns:repeat(5,minmax(0,1fr))}.stops small{display:none}.stops::before{top:48px}.stops li button{aspect-ratio:1}
  .tbl thead{display:none}.tbl tr{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}.tbl td{border:0;padding:0}.tbl td:nth-child(2){grid-column:2}.tbl td:nth-child(n+3){grid-column:2}
  .rounds{flex-direction:column;gap:12px}.rounds::before{left:9px;right:auto;top:10px;bottom:10px;width:6px;height:auto}.rounds li{display:grid;grid-template-columns:24px 1fr;gap:10px}
  .vw-body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 38vh}.vw-side{border-left:0;border-top:1px solid #262d38}
  #searchinfo,footer{padding-left:16px;padding-right:16px}
}

function filters(attr, sel, key) {
  document.querySelectorAll(`[${attr}]`).forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(`[${attr}]`).forEach((x) => x.setAttribute("aria-pressed", x === b));
    const v = b.getAttribute(attr);
    document.querySelectorAll(sel).forEach((el) => { el.style.display = v === "전체" || el.dataset[key] === v ? "" : "none"; });
  }));
}
// the network: one line per collection, stops = runs, double-ring transfer where a reference is shared
function network(w) {
  const C = H.collections, narrow = w < 640, labelW = narrow ? 0 : 230, rowH = narrow ? 74 : 62, top = 18;
  const x0 = labelW + 20, x1 = w - 30, h = top + C.length * rowH + 10;
  const y = (i) => top + i * rowH + (narrow ? 40 : 22);
  const xfers = H.shared.map((s, k) => ({ s, x: x0 + (x1 - x0) * (0.45 + k * 0.28) }));
  let svg = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="조사 노선도: 조사 ${C.length}개, 여러 조사에 걸친 레퍼런스 ${H.shared.length}개">`;
  xfers.forEach(({ s, x }) => { const ys = s.in.map((c) => y(C.findIndex((k) => k.id === c))); svg += `<line x1="${x}" x2="${x}" y1="${Math.min(...ys)}" y2="${Math.max(...ys)}" stroke="#111827" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>`; });
  C.forEach((c, i) => {
    const yy = y(i), col = HEX[c.id];
    svg += narrow ? `<text x="${x0 - 20}" y="${yy - 18}" font-size="13" font-weight="700" fill="#111827">${esc(c.title)}${c.synthetic ? " (가상)" : ""}</text>` : `<text x="0" y="${yy + 5}" font-size="14" font-weight="700" fill="#111827">${esc(c.title.length > 13 ? c.title.slice(0, 13) + "…" : c.title)}${c.synthetic ? " (가상)" : ""}</text>`;
    svg += `<line x1="${x0}" x2="${x1}" y1="${yy}" y2="${yy}" stroke="${col}" stroke-width="7" stroke-linecap="round"/>`;
    for (let r = 0; r < c.runs; r++) { const xx = x0 + 12 + r * 46; svg += `<circle cx="${xx}" cy="${yy}" r="8" fill="#fff" stroke="${col}" stroke-width="4"/>`; }
    svg += `<text x="${x0 + 12 + c.runs * 46 - 8}" y="${yy - 13}" font-size="11.5" fill="#414b5a">R${c.runs} · ${c.date.slice(5).replace("-", ".")}</text>`;
    svg += `<text x="${x1}" y="${yy + 22}" font-size="12" fill="#414b5a" text-anchor="end">레퍼런스 ${c.refs} · 발견 ${c.claims}${c.open ? ` · 질문 ${c.open}` : ""}</text>`;
  });
  xfers.forEach(({ s, x }) => s.in.forEach((c) => { const yy = y(C.findIndex((k) => k.id === c)); svg += `<circle cx="${x}" cy="${yy}" r="9" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="${x}" cy="${yy}" r="4" fill="#111827"/>`; }));
  xfers.forEach(({ s, x }) => { svg += `<text x="${x + 13}" y="${top + 4}" font-size="12" font-weight="700" fill="#111827">${s.ref} ${esc(s.product)} 환승</text>`; });
  return svg + "</svg>";
}

<div class="top"><span class="badge num">${i + 1}</span><h3>${c.synthetic ? esc(c.title) : `<a href="#">${esc(c.title)}</a>`}</h3>${c.synthetic ? `<span class="synth">가상 예시</span>` : ""}</div>

  const across = sec("across", "조사 사이에 겹치는 것", "두 조사 이상에서 나온 해법입니다. 색 점은 그 패턴이 나온 조사와 제품 수입니다.",
    `<ul class="list">${H.patterns.map((p) => `<li data-search="${esc(p.label + " " + p.question)}"><i class="st ${p.verdict ? "full" : ""}"></i><div><p><b>${esc(p.question)}</b> <span class="small">${esc(p.label)}</span></p>
<p class="small">${p.verdict ? `결론: ${esc(p.verdict)}` : "결론 없음 — 아직 verdict를 기록하지 않음"}</p><p class="small" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px">${Object.entries(p.in).map(([k, n]) => `<span style="display:inline-flex;gap:6px;align-items:center"><i class="st full" style="--lc:${LINE[k]}"></i>${ctitle(k)} ${n}</span>`).join("")}</p></div></li>`).join("")}
${H.shared.map((s) => `<li data-search="${esc(s.product)}"><i class="st xfer"></i><div><p><b>${s.ref} ${esc(s.product)}</b> <span class="small">환승 레퍼런스 · 조사 ${s.in.length}개</span></p><p class="small">${s.in.map((k) => ctitle(k)).join(" · ")}</p></div></li>`).join("")}</ul>`);
  const openq = sec("openq", "추가 질문", "아직 답하지 않은 질문입니다.",
    `<ul class="list">${B.open.map((o) => `<li data-search="${esc(o.text)}"><i class="st" style="--lc:var(--l1)"></i><div><p><b>${esc(o.text)}</b></p><p class="small">메모 앱 요금제 비교 · ${esc(o.why)}</p></div></li>`).join("")}</ul><div class="prompts"><button type="button" class="btn line" data-copy="continue">이 질문들로 이어서 하기 — 프롬프트 복사</button></div>`);
  document.getElementById("app").innerHTML = band + map + cards + across + openq + Draft.trayHtml() + Draft.viewerHtml();
  const net = document.getElementById("net"); const draw = () => { net.innerHTML = network(net.clientWidth - 36); }; draw();
  window.onresize = () => { if (document.getElementById("net")) draw(); };
  document.getElementById("railfoot").textContent = `${C.length}개 조사 · ${totals.refs}개 레퍼런스 · 2026-11-13 기준`;
  setNav([["map", "노선도", null], ["cols", "조사", C.length], ["across", "겹치는 것", H.patterns.length + H.shared.length], ["openq", "추가 질문", totals.open]], "#1f2937");
  filters("data-topic", ".card[data-t]", "t");
}
Draft.route(drawBoard, drawHome);
Draft.bindSearch(document.getElementById("q"));
</script>
</body>
